name: CI Pipeline
permissions:
  contents: read
env:
  # One place for the toolchain versions. A minor version gets the latest patch.
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: v2.14.0
  # The -race runs leave x/crypto's argon2 uninstrumented: sealing or opening
  # any entry derives a key with it over 16 MiB, which instrumented was most
  # of their time. It is pure computation; sesh's own code stays instrumented.
  RACE_GCFLAGS: golang.org/x/crypto/argon2=-race=false
  # With it, the -race runs also turn off Go's size-specialized allocation.
  # The compiler uses it only in code it doesn't instrument (here, argon2),
  # and it skips telling the race detector memory is new: two key derivations
  # at once then reuse memory the detector still holds the other's accesses
  # for, and it reports a race that isn't one.
  RACE_GOEXPERIMENT: nosizespecializedmalloc
on:
  push:
    branches: [ main ]  # Only run on pushes to main
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]  # Run on PRs to main

# A new push to a PR cancels that PR's run still going; pushes to main and
# tags each run in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-latest  # macOS for sesh (Touch ID's native code)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin "$GOLANGCI_LINT_VERSION"
          golangci-lint --version

      - name: Check code formatting
        run: |
          UNFORMATTED=$(goimports -l -local github.com/bashhack/sesh $(find . -name '*.go' -not -path './vendor/*' -not -path './scripts/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ The following files need formatting:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run: make format"
            exit 1
          fi
          echo "✅ All files properly formatted"

      - name: Run go vet
        run: go vet $(go list ./... | grep -v /scripts)

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: macos-latest  # macOS for sesh (Touch ID's native code)
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run unit tests with coverage
        run: |
          go test -timeout 30m -coverprofile=coverage.txt $(go list ./... | grep -v /scripts)
          grep -v "testutil\|mock\|provider/interfaces.go\|scripts/\|cmd/sesh/main.go" coverage.txt > coverage.filtered.txt || true
          go tool cover -html=coverage.filtered.txt -o coverage.html
          rm -f coverage.filtered.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: ./coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build without cgo
        # A `go install` on a Mac without Xcode's command-line tools builds
        # without cgo; Touch ID then reports unavailable, but sesh must build.
        run: CGO_ENABLED=0 go build ./... && CGO_ENABLED=0 go vet ./internal/touchid

      - name: Build binary
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sesh-binary
          path: ./build/sesh
          if-no-files-found: error

  # Its own job so it runs beside the coverage run, not after it.
  race:
    name: Test with -race
    runs-on: macos-latest  # macOS for sesh (Touch ID's native code)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run tests with race detection
        run: |
          CORES=$(sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
          RACE_CORES=$([ $CORES -gt 4 ] && echo 4 || echo $CORES)
          GOEXPERIMENT=$RACE_GOEXPERIMENT GOMAXPROCS=$RACE_CORES go test -timeout 30m -race -gcflags="$RACE_GCFLAGS" -vet=off $(go list ./... | grep -v /scripts)

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install zsh and fish for the shell completion tests
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Run tests with race detection
        run: GOEXPERIMENT=$RACE_GOEXPERIMENT go test -timeout 30m -race -gcflags="$RACE_GCFLAGS" $(go list ./... | grep -v /scripts)

  agent-smoke:
    name: Agent smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Off here: this short job would save the cache first, under the key the
          # test jobs share, without the -race build they need.
          cache: false

      - name: Build sesh and run the agent end to end
        run: make agent-smoke

  release:
    name: Release
    runs-on: macos-latest  # macOS for sesh
    needs: [lint, test, race, test-linux, agent-smoke]
    if: github.ref_type == 'tag'

    # Requires a 'RELEASE_TOKEN' secret (personal access token with 'repo' permissions)
    # The token allows GitHub release creation to trigger subsequent workflow runs

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Signing is all or nothing: GoReleaser signs without notarizing when
      # a notary secret is missing, which Gatekeeper still blocks.
      - name: Check the macOS signing secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set=0
          for v in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -n "${!v}" ]; then set=$((set + 1)); else echo "not set: $v"; fi
          done
          if [ "$set" != 0 ] && [ "$set" != 5 ]; then
            echo "::error::$set of the 5 macOS signing secrets are set: set all five to sign and notarize, or none"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # v2 keeps the brews section, deprecated since 2.10.
          version: "~> v2"
          args: release --clean
          workdir: .
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Signing and notarizing the macOS binaries; off while unset.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
