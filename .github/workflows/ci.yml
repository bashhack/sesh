name: CI Pipeline
permissions:
  contents: read
env:
  # One place for the toolchain versions. A minor version gets the latest patch.
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: v2.14.0
  # The -race runs leave x/crypto's argon2 uninstrumented: sealing or opening
  # any entry derives a key with it over 16 MiB, which instrumented was most
  # of their time. It is pure computation; sesh's own code stays instrumented.
  RACE_GCFLAGS: golang.org/x/crypto/argon2=-race=false
  # With it, the -race runs also turn off Go's size-specialized allocation.
  # The compiler uses it only in code it doesn't instrument (here, argon2),
  # and those allocation functions (runtime/malloc_generated.go) skip telling
  # the race detector memory is new: code touching argon2's small objects
  # can then be reported as racing with whatever last used that memory.
  # Drop it once Go no longer has the experiment (an unknown name fails the
  # build) or allocates that way in uninstrumented code.
  RACE_GOEXPERIMENT: nosizespecializedmalloc
on:
  push:
    branches: [ main ]  # Only run on pushes to main
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]  # Run on PRs to main

# A new push to a PR cancels that PR's run still going; pushes to main and
# tags each run in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-latest  # macOS for sesh (Touch ID's native code)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin "$GOLANGCI_LINT_VERSION"
          golangci-lint --version

      - name: Check code formatting
        run: |
          UNFORMATTED=$(goimports -l -local github.com/bashhack/sesh $(find . -name '*.go' -not -path './vendor/*' -not -path './scripts/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ The following files need formatting:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run: make format"
            exit 1
          fi
          echo "✅ All files properly formatted"

      - name: Run go vet
        run: go vet $(go list ./... | grep -v /scripts)

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: macos-latest  # macOS for sesh (Touch ID's native code)
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run unit tests with coverage
        run: |
          go test -timeout 30m -coverprofile=coverage.txt $(go list ./... | grep -v /scripts)
          grep -v "testutil\|mock\|provider/interfaces.go\|scripts/\|cmd/sesh/main.go" coverage.txt > coverage.filtered.txt || true
          go tool cover -html=coverage.filtered.txt -o coverage.html
          rm -f coverage.filtered.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: ./coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build without cgo
        # A `go install` on a Mac without Xcode's command-line tools builds
        # without cgo; Touch ID then reports unavailable, but sesh must build.
        run: CGO_ENABLED=0 go build ./... && CGO_ENABLED=0 go vet ./internal/touchid

      - name: Build binary
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sesh-binary
          path: ./build/sesh
          if-no-files-found: error

  # Its own jobs so they run beside the coverage run, not after it: three,
  # so the slowest package, sesh/cmd/sesh, whose tests mostly can't run in
  # parallel (they set environment variables), is split between two by
  # test name (every other one, sorted, as go test -list gives them), and
  # the rest run in the third.
  race:
    name: Test with -race (${{ matrix.part }})
    runs-on: macos-latest  # macOS for sesh (Touch ID's native code)
    strategy:
      fail-fast: false
      matrix:
        part: [commands 1 of 2, commands 2 of 2, the rest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run tests with race detection
        env:
          PART: ${{ matrix.part }}
        run: |
          CORES=$(sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
          RACE_CORES=$([ $CORES -gt 4 ] && echo 4 || echo $CORES)
          export GOEXPERIMENT=$RACE_GOEXPERIMENT
          CMD=github.com/bashhack/sesh/sesh/cmd/sesh
          case "$PART" in
            "the rest")
              PKGS=$(go list ./... | grep -v /scripts | grep -vx "$CMD")
              RUN=.
              ;;
            "commands "*)
              # Its tests, as go test lists them, every other one: the first
              # half takes the odd lines, the second the even. Listed with
              # the run's own flags, the test binary built is the one the
              # run then takes from the build cache.
              HALF=${PART#commands }; HALF=${HALF%% *}
              LISTED=$(go test -race -gcflags="$RACE_GCFLAGS" -vet=off -list '.*' "$CMD")
              NAMES=$(echo "$LISTED" | grep -E '^(Test|Fuzz|Example)' | sort | awk -v h="$HALF" 'NR % 2 == h % 2' | paste -sd'|' -)
              [ -n "$NAMES" ] || { echo "no tests found for $PART"; exit 1; }
              echo "$PART: $(echo "$NAMES" | tr '|' '\n' | wc -l | tr -d ' ') tests"
              PKGS=$CMD
              RUN="^($NAMES)\$"
              ;;
            *) echo "unknown part $PART"; exit 1 ;;
          esac
          GOMAXPROCS=$RACE_CORES go test -timeout 30m -race -gcflags="$RACE_GCFLAGS" -vet=off -run "$RUN" $PKGS

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install zsh and fish for the shell completion tests
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Run tests with race detection
        run: GOEXPERIMENT=$RACE_GOEXPERIMENT go test -timeout 30m -race -gcflags="$RACE_GCFLAGS" $(go list ./... | grep -v /scripts)

  agent-smoke:
    name: Agent smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Off here: on Linux this short job would save the cache first, under
          # the key Test (Linux) shares, without the -race build it needs.
          cache: false

      - name: Build sesh and run the agent end to end
        run: make agent-smoke

  release:
    name: Release
    runs-on: macos-latest  # macOS for sesh
    needs: [lint, test, race, test-linux, agent-smoke]
    if: github.ref_type == 'tag'

    # Requires a 'RELEASE_TOKEN' secret (personal access token with 'repo' permissions)
    # The token allows GitHub release creation to trigger subsequent workflow runs

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Signing is all or nothing: GoReleaser signs without notarizing when
      # a notary secret is missing, which Gatekeeper still blocks.
      - name: Check the macOS signing secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set=0
          for v in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -n "${!v}" ]; then set=$((set + 1)); else echo "not set: $v"; fi
          done
          if [ "$set" != 0 ] && [ "$set" != 5 ]; then
            echo "::error::$set of the 5 macOS signing secrets are set: set all five to sign and notarize, or none"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # v2 keeps the brews section, deprecated since 2.10.
          version: "~> v2"
          args: release --clean
          workdir: .
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Signing and notarizing the macOS binaries; off while unset.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
