version: 2
project_name: sesh

before:
  hooks:
    - go mod tidy

builds:
  - id: darwin
    env:
      # cgo is on for macOS: Touch ID unlock calls the Secure Enclave through
      # a small cgo shim (internal/touchid). The release job runs on macOS,
      # whose clang builds both architectures.
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./sesh/cmd/sesh
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
  - id: linux
    env:
      # Pure Go on Linux: no Touch ID, and SQLite is modernc's, so the macOS
      # release job cross-builds it.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./sesh/cmd/sesh
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

# The macOS binaries are signed with a Developer ID certificate and
# notarized by Apple, so Gatekeeper lets a downloaded one run. It's on once
# the certificate is given (isEnvSet counts "" as unset, which is what
# GitHub passes for a secret that isn't), so a local snapshot (make release)
# builds unsigned; the release job refuses to run without all five secrets.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - darwin
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # A release waits for Apple's answer, so one that fails stops it.
        # quill asks for a token that lasts this plus 2 minutes; Apple
        # takes one of up to 20.
        wait: true
        timeout: 18m

archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: darwin
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/*.md
brews:
  - repository:
      owner: bashhack
      name: homebrew-sesh
    directory: Formula
    homepage: https://github.com/bashhack/sesh
    description: Terminal-first toolkit for secure credential workflows
    license: MIT
    test: |
      assert_match version.to_s, shell_output("#{bin}/sesh --version")
    install: |
      bin.install "sesh"
      # sesh completion bash|zsh|fish, into Homebrew's completion folders.
      generate_completions_from_executable(bin/"sesh", "completion")
    caveats: |
      sesh aws needs the AWS CLI (brew install awscli); nothing else does.
      Shell completion is installed for bash, zsh and fish; your shell's
      completion has to be turned on to use it: https://docs.brew.sh/Shell-Completion
      sesh's browser extension (github.com/bashhack/sesh-browser, loaded by hand)
      needs one step, run once: sesh browser install
checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: bashhack
    name: sesh
  prerelease: auto
  draft: false
  name_template: "v{{.Version}}"
